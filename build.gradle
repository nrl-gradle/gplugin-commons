plugins{
    id 'java-gradle-plugin'
    id 'groovy'
    id 'java'
    id 'com.gradle.plugin-publish' version '1.3.0'
    id 'nrlssc.gradle' version '4.0.126'
}

sourceCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

dependencies {
    api gradleApi()
    implementation localGroovy()


    testImplementation gradleTestKit(),
            'junit:junit:4.12'
}

hgit{
    forceGit = true
}
    

gradlePlugin {
    website = 'https://github.com/nrl-gradle/gplugin-commons'
    vcsUrl = 'https://github.com/nrl-gradle/gplugin-commons.git'

    //noinspection GroovyAssignabilityCheck
    plugins {
        create('commonsLib'){
            id = 'nrlssc.gplugin-commons'
            displayName = 'gplugin-commons'
            description = 'This is not a plugin, just a library needed for other nrlssc plugins'
            implementationClass = 'nrlssc.gradle.helpers.PluginUtils'
            tags = ['common']
        }
    }
}
